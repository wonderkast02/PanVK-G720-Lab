name: Lab CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
 validate:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
    with: {python-version: "3.x"}
  - run: python tools/capdiff.py --selftest
  - run: python -c 'import json,glob;[json.load(open(p)) for p in glob.glob("schemas/*.json")+glob.glob("capabilities/baselines/*.json")];print("JSON PASS")'
  - run: 'test -z "$(find . -type f \( -name "*.apk" -o -name "*.so" -o -name "*.tzst" -o -name "*.img" \) -print)"'
